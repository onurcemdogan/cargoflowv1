<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="CargoFlow">
  <!--
    CargoFlow tarayıcı sekmesi simgesi: CF monogramı (beyaz "C" halkası +
    turkuaz "F"), koyu lacivert zeminde. Geometri logonun oranlarından
    ölçeklenmiştir; kare viewBox (64×64) → sekmede EZİLMEZ, beyaz boşluk
    bırakmaz. Uygulama içi CargoFlow görselleri bu dosyadan BAĞIMSIZDIR.
  -->
  <rect width="64" height="64" rx="13" fill="#0B1B3E" />
  <!--
    "C": sağ tarafı açık halka. Yay sağ-üstten SOL taraf üzerinden sağ-alta
    gider; kalan sağ-alt bölümü "F" zaten örter (logodaki katmanlanma).
  -->
  <path
    d="M36.8 20.3A12.4 12.4 0 1 0 36.8 40.7"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="6"
  />
  <!-- "F": dikey gövde + üst kol tek parça; uçlar logodaki gibi eğik kesim. -->
  <g fill="#21D4EE">
    <path d="M26.2 24.7H52l-3.5 5.7H31.9v19.8l-5.7-4.4z" />
    <path d="M31.9 33.2h15.2l-3.2 5.6H31.9z" />
  </g>
</svg>
