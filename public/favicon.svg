<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="CargoFlow">
  <!--
    CargoFlow tarayıcı sekmesi simgesi. Logo MARKASI (hız çizgileri + kamyon)
    16 px'te okunabilir kalacak şekilde sadeleştirilmiştir: ince detay yok,
    kare oran (viewBox 64×64) → sekmede EZİLMEZ, beyaz boşluk bırakmaz.
    Uygulama içi CargoFlow görselleri bu dosyadan BAĞIMSIZDIR.
  -->
  <rect width="64" height="64" rx="14" fill="#0E2036" />
  <!-- Hız çizgileri (logodaki mavi akış). -->
  <g fill="#2F6BFF">
    <rect x="4" y="24" width="14" height="4.5" rx="2.25" />
    <rect x="7" y="33" width="11" height="4.5" rx="2.25" />
    <rect x="4" y="42" width="14" height="4.5" rx="2.25" />
  </g>
  <!-- Kamyon: kasa + kabin tek siluet (beyaz), tekerlekler ayrık. -->
  <path
    fill="#FFFFFF"
    d="M22 19h19a2 2 0 0 1 2 2v6h5.6a2 2 0 0 1 1.62.83l4.4 6.06a2 2 0 0 1 .38 1.17V43a2 2 0 0 1-2 2h-2.2a6.6 6.6 0 0 0-12.8 0h-2.6a6.6 6.6 0 0 0-12.8 0H22a2 2 0 0 1-2-2V21a2 2 0 0 1 2-2Zm21 12h9.1l-3.5-4.8A1 1 0 0 0 47.8 26H43v5Z"
  />
  <g fill="#FFFFFF">
    <circle cx="29" cy="46.5" r="4.6" />
    <circle cx="45" cy="46.5" r="4.6" />
  </g>
  <g fill="#0E2036">
    <circle cx="29" cy="46.5" r="1.9" />
    <circle cx="45" cy="46.5" r="1.9" />
  </g>
</svg>
